<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>逸碎AI - 智能助手</title>
    <link rel="icon" type="image/png" href="icons/icon-192.png">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "PingFang SC", "Microsoft YaHei", sans-serif;
            background: #f7f8fa;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            color: #1f2329;
        }

        .container {
            width: 100%;
            max-width: 480px;
        }

        .card {
            background: #ffffff;
            border: 1px solid #e5e6eb;
            border-radius: 12px;
            padding: 40px 36px;
            text-align: center;
        }

        .logo {
            width: 56px;
            height: 56px;
            border-radius: 12px;
            background: #3370ff;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
            font-weight: 700;
            color: #ffffff;
            margin-bottom: 20px;
        }

        h1 {
            font-size: 24px;
            font-weight: 600;
            margin-bottom: 8px;
            letter-spacing: -0.5px;
        }

        .subtitle {
            font-size: 14px;
            color: #646a73;
            margin-bottom: 32px;
            line-height: 1.6;
        }

        .btn {
            display: block;
            width: 100%;
            padding: 14px 20px;
            border: none;
            border-radius: 8px;
            font-size: 15px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.15s ease;
            text-decoration: none;
            margin-bottom: 12px;
            font-family: inherit;
        }

        .btn-primary {
            background: #3370ff;
            color: #ffffff;
        }

        .btn-primary:hover {
            background: #2860e1;
        }

        .btn-outline {
            background: #ffffff;
            color: #1f2329;
            border: 1px solid #e5e6eb;
        }

        .btn-outline:hover {
            border-color: #3370ff;
            color: #3370ff;
        }

        .divider {
            display: flex;
            align-items: center;
            margin: 28px 0 20px;
            color: #999;
            font-size: 12px;
        }

        .divider::before,
        .divider::after {
            content: '';
            flex: 1;
            height: 1px;
            background: #e5e6eb;
        }

        .divider span {
            padding: 0 16px;
        }

        .features {
            display: flex;
            justify-content: center;
            gap: 32px;
        }

        .feature {
            font-size: 13px;
            color: #646a73;
        }

        .feature strong {
            color: #1f2329;
            font-weight: 600;
        }

        .footer {
            text-align: center;
            margin-top: 24px;
            font-size: 12px;
            color: #999;
        }

        @media (max-width: 480px) {
            .card {
                padding: 32px 24px;
            }

            .features {
                flex-direction: column;
                gap: 12px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="card">
            <div class="logo">逸</div>
            <h1>逸碎AI</h1>
            <p class="subtitle">智能对话助手<br>支持多人格、图片识别、无限制对话</p>

            <a href="app.html" class="btn btn-primary">网页版使用</a>
            <a href="download.html" class="btn btn-outline">下载客户端</a>

            <div class="divider"><span>功能</span></div>

            <div class="features">
                <div class="feature"><strong>5种</strong> 人格</div>
                <div class="feature"><strong>图片</strong> 识别</div>
                <div class="feature"><strong>无限</strong> 对话</div>
            </div>
        </div>

        <div class="footer">v1.0.0</div>
    </div>
</body>
</html>
