<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>逸碎AI</title>
    <link rel="icon" type="image/png" href="icons/icon-192.png">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "PingFang SC", "Microsoft YaHei", sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .card {
            background: white;
            border-radius: 24px;
            padding: 48px 40px;
            max-width: 420px;
            width: 100%;
            text-align: center;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            animation: fadeIn 0.5s ease-out;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .logo {
            width: 72px;
            height: 72px;
            border-radius: 18px;
            background: linear-gradient(135deg, #3370ff 0%, #5b8def 100%);
            display: inline-flex;
            align-items: center;
            justify-content: center;
            font-size: 32px;
            font-weight: bold;
            color: white;
            margin-bottom: 20px;
        }

        h1 {
            font-size: 28px;
            font-weight: 700;
            color: #1f2329;
            margin-bottom: 8px;
        }

        .subtitle {
            font-size: 15px;
            color: #646a73;
            margin-bottom: 36px;
            line-height: 1.5;
        }

        .btn {
            display: block;
            width: 100%;
            padding: 16px;
            border: none;
            border-radius: 14px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
            text-decoration: none;
            margin-bottom: 14px;
        }

        .btn-primary {
            background: #3370ff;
            color: white;
        }

        .btn-primary:hover {
            background: #2860e1;
            transform: translateY(-2px);
        }

        .btn-secondary {
            background: #f5f6f7;
            color: #1f2329;
        }

        .btn-secondary:hover {
            background: #e8eaed;
            transform: translateY(-2px);
        }

        .btn-icon {
            margin-right: 8px;
        }

        .divider {
            display: flex;
            align-items: center;
            margin: 24px 0;
            color: #999;
            font-size: 13px;
        }

        .divider::before,
        .divider::after {
            content: '';
            flex: 1;
            height: 1px;
            background: #e5e6eb;
        }

        .divider span {
            padding: 0 16px;
        }

        .features {
            display: flex;
            justify-content: center;
            gap: 24px;
            margin-top: 8px;
        }

        .feature {
            font-size: 13px;
            color: #999;
        }

        .feature span {
            margin-right: 4px;
        }

        .version {
            margin-top: 28px;
            font-size: 12px;
            color: #bbb;
        }

        @media (max-width: 480px) {
            .card {
                padding: 36px 28px;
            }

            h1 {
                font-size: 24px;
            }

            .features {
                flex-direction: column;
                gap: 8px;
            }
        }
    </style>
</head>
<body>
    <div class="card">
        <div class="logo">逸</div>
        <h1>逸碎AI</h1>
        <p class="subtitle">你的智能助手<br>多人格 · 图片识别 · 无限制对话</p>

        <a href="app.html" class="btn btn-primary">
            <span class="btn-icon">🌐</span>网页版立即使用
        </a>

        <button class="btn btn-secondary" onclick="downloadApp()">
            <span class="btn-icon">📱</span>下载APP安装包
        </button>

        <div class="divider"><span>核心功能</span></div>

        <div class="features">
            <div class="feature"><span>🎭</span>5种人格</div>
            <div class="feature"><span>🖼️</span>图片识别</div>
            <div class="feature"><span>💬</span>无限制</div>
        </div>

        <div class="version">v1.0.0</div>
    </div>

    <script>
        function downloadApp() {
            const apkUrl = 'https://raw.githubusercontent.com/yichen725/yisui-ai/main/yisui-ai-v1.0.apk';
            const link = document.createElement('a');
            link.href = apkUrl;
            link.download = '逸碎AI-v1.0.apk';
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
        }
    </script>
</body>
</html>
