<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>逸碎 · 管理后台</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "PingFang SC", "Microsoft YaHei", sans-serif;
            background: #f7f8fa;
            color: #1f2329;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }
        .app-header {
            background: white;
            border-bottom: 1px solid #e5e6eb;
            padding: 16px 32px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-shrink: 0;
        }
        .app-header .brand { display: flex; align-items: center; gap: 12px; }
        .app-header .brand .logo {
            font-size: 22px; font-weight: 700;
            background: linear-gradient(135deg, #1f2329, #4f6ef7);
            -webkit-background-clip: text; -webkit-text-fill-color: transparent;
        }
        .app-header .brand .badge {
            background: #eef1ff; color: #4f6ef7;
            font-size: 12px; font-weight: 600;
            padding: 2px 12px; border-radius: 20px;
        }
        .app-header .user-area { display: flex; align-items: center; gap: 16px; }
        .btn-logout {
            padding: 6px 16px; border: 1px solid #e5e6eb;
            border-radius: 8px; background: white;
            font-size: 13px; color: #7e8493; cursor: pointer;
            transition: all 0.2s; font-family: inherit;
        }
        .btn-logout:hover { background: #f7f8fa; color: #1f2329; }
        .app-main {
            flex: 1; display: flex; flex-direction: column;
            max-width: 1200px; width: 100%; margin: 0 auto;
            padding: 24px 32px 32px;
        }
        .welcome-area { text-align: center; margin-bottom: 24px; }
        .welcome-area h2 { font-size: 24px; font-weight: 600; margin-bottom: 4px; }
        .welcome-area p { font-size: 14px; color: #7e8493; }
        .nav-tabs {
            display: flex; gap: 6px; flex-wrap: wrap;
            margin-bottom: 20px; background: white;
            padding: 4px; border-radius: 14px;
            border: 1px solid #e5e6eb; width: fit-content;
        }
        .nav-tab {
            padding: 10px 20px; border: none; background: transparent;
            border-radius: 10px; font-size: 14px; font-weight: 500;
            color: #7e8493; cursor: pointer; transition: all 0.2s;
            font-family: inherit; white-space: nowrap;
        }
        .nav-tab:hover { background: #f2f3f5; color: #1f2329; }
        .nav-tab.active { background: #1f2329; color: white; }
        .tab-panels { flex: 1; display: flex; flex-direction: column; }
        .panel { display: none; flex-direction: column; gap: 16px; animation: fadeUp 0.25s ease; }
        .panel.active { display: flex; }
        @keyframes fadeUp { 0% { opacity: 0; transform: translateY(6px); } 100% { opacity: 1; transform: translateY(0); } }
        .stats-grid {
            display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 16px;
        }
        .stat-card {
            background: white; border: 1px solid #e5e6eb;
            border-radius: 14px; padding: 18px 20px; transition: all 0.2s;
        }
        .stat-card:hover { box-shadow: 0 4px 16px rgba(0,0,0,0.04); }
        .stat-card .label { font-size: 13px; color: #7e8493; margin-bottom: 4px; }
        .stat-card .value { font-size: 28px; font-weight: 700; }
        .stat-card .value.primary { color: #4f6ef7; }
        .stat-card .value.green { color: #2ecc71; }
        .stat-card .value.orange { color: #f39c12; }
        .toolbar {
            display: flex; gap: 12px; flex-wrap: wrap; align-items: center;
            background: white; padding: 14px 20px; border-radius: 14px;
            border: 1px solid #e5e6eb;
        }
        .toolbar input, .toolbar select {
            padding: 10px 14px; border: 1px solid #e5e6eb;
            border-radius: 10px; font-size: 14px; font-family: inherit;
            outline: none; background: white; min-width: 140px;
        }
        .toolbar input:focus { border-color: #4f6ef7; }
        .btn {
            padding: 10px 20px; border: none; border-radius: 10px;
            font-size: 14px; font-weight: 600; cursor: pointer;
            transition: all 0.2s; font-family: inherit;
        }
        .btn-primary { background: #1f2329; color: white; }
        .btn-primary:hover { background: #2d3342; }
        .btn-secondary { background: #f2f3f5; color: #1f2329; }
        .btn-secondary:hover { background: #e5e6eb; }
        .btn-danger { background: #fee9e7; color: #e74c3c; }
        .btn-danger:hover { background: #fdd5d2; }
        .btn-sm { padding: 6px 14px; font-size: 13px; border-radius: 8px; }
        .list-container {
            background: white; border: 1px solid #e5e6eb;
            border-radius: 14px; overflow: hidden; flex: 1;
        }
        .list-item {
            display: flex; align-items: center; justify-content: space-between;
            padding: 14px 20px; border-bottom: 1px solid #f2f3f5;
            transition: background 0.15s;
        }
        .list-item:last-child { border-bottom: none; }
        .list-item:hover { background: #fafbfc; }
        .list-item .main-info { display: flex; flex-direction: column; gap: 2px; flex: 1; min-width: 0; }
        .list-item .main-info .title { font-weight: 500; font-size: 15px; }
        .list-item .main-info .sub { font-size: 13px; color: #7e8493; }
        .list-item .main-info .content-preview {
            font-size: 14px; background: #f7f8fa; padding: 4px 12px;
            border-radius: 8px; margin-top: 4px; max-width: 600px;
            overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
        }
        .list-item .actions { display: flex; gap: 8px; align-items: center; flex-shrink: 0; }
        .status-tag { padding: 4px 12px; border-radius: 20px; font-size: 12px; font-weight: 600; }
        .status-tag.used { background: #fee9e7; color: #e74c3c; }
        .status-tag.unused { background: #e4f5e9; color: #2ecc71; }
        .status-tag.pending { background: #fff6e5; color: #f39c12; }
        .empty-state { text-align: center; padding: 48px 20px; color: #c0c6d4; font-size: 14px; }
        .pagination {
            display: flex; justify-content: center; gap: 8px;
            padding: 16px; background: white; border-top: 1px solid #f2f3f5;
        }
        .pagination button {
            padding: 6px 12px; border: 1px solid #e5e6eb;
            border-radius: 6px; background: white; cursor: pointer;
            font-size: 13px; font-family: inherit;
        }
        .pagination button:disabled { opacity: 0.5; cursor: not-allowed; }
        .pagination button.active { background: #1f2329; color: white; border-color: #1f2329; }
        .toast {
            position: fixed; bottom: 30px; right: 30px;
            padding: 14px 28px; border-radius: 12px; font-size: 14px;
            background: white; border: 1px solid #e5e6eb;
            box-shadow: 0 8px 30px rgba(0,0,0,0.06); display: none;
            z-index: 999;
        }
        .toast.success { border-left: 4px solid #2ecc71; color: #1a7a4a; }
        .toast.error { border-left: 4px solid #e74c3c; color: #a93226; }
        /* 登录页 */
        .login-container {
            display: flex; align-items: center; justify-content: center;
            min-height: 100vh; padding: 20px;
        }
        .login-card {
            background: white; border: 1px solid #e5e6eb;
            border-radius: 16px; padding: 40px 32px;
            width: 100%; max-width: 380px;
        }
        .login-card h1 { font-size: 24px; font-weight: 700; text-align: center; margin-bottom: 8px; }
        .login-card .subtitle { font-size: 14px; color: #7e8493; text-align: center; margin-bottom: 28px; }
        .login-card .form-group { margin-bottom: 16px; }
        .login-card .form-group label { display: block; font-size: 13px; color: #7e8493; margin-bottom: 6px; }
        .login-card .form-group input {
            width: 100%; padding: 12px 14px; border: 1px solid #e5e6eb;
            border-radius: 10px; font-size: 15px; font-family: inherit; outline: none;
        }
        .login-card .form-group input:focus { border-color: #4f6ef7; }
        .login-card .error-msg { color: #e74c3c; font-size: 13px; text-align: center; margin-top: 12px; display: none; }
        @media (max-width: 768px) {
            .app-header { padding: 12px 16px; }
            .app-main { padding: 16px; }
            .nav-tabs { width: 100%; overflow-x: auto; flex-wrap: nowrap; }
            .nav-tab { flex: 1; text-align: center; padding: 8px 12px; font-size: 13px; }
            .stats-grid { grid-template-columns: 1fr 1fr; }
            .toolbar { flex-direction: column; align-items: stretch; }
            .toolbar input { min-width: auto; }
            .list-item { flex-direction: column; align-items: flex-start; gap: 10px; }
            .list-item .actions { width: 100%; justify-content: flex-start; }
        }
    </style>
</head>
<body>
    <!-- 登录页 -->
    <div class="login-container" id="loginPage">
        <div class="login-card">
            <h1>逸碎 管理后台</h1>
            <p class="subtitle">请输入管理员密码登录</p>
            <div class="form-group">
                <label>管理员密码</label>
                <input type="password" id="passwordInput" placeholder="请输入密码" onkeydown="if(event.key==='Enter')login()">
            </div>
            <button class="btn btn-primary" style="width:100%;" onclick="login()">登录</button>
            <div class="error-msg" id="loginError"></div>
        </div>
    </div>

    <!-- 管理后台 -->
    <div id="adminPage" style="display:none; min-height:100vh; display:flex; flex-direction:column;">
        <header class="app-header">
            <div class="brand">
                <span class="logo">逸碎</span>
                <span class="badge">管理后台</span>
            </div>
            <div class="user-area">
                <span style="font-size:14px;color:#7e8493;">管理员</span>
                <button class="btn-logout" onclick="handleLogout()">退出登录</button>
            </div>
        </header>

        <main class="app-main">
            <div class="welcome-area">
                <h2>你好！我是逸碎</h2>
                <p>在这里可以管理用户、查看聊天记录与系统数据</p>
            </div>

            <div class="nav-tabs" id="navTabs">
                <button class="nav-tab active" data-panel="dashboard">总览</button>
                <button class="nav-tab" data-panel="users">用户</button>
                <button class="nav-tab" data-panel="chats">聊天记录</button>
                <button class="nav-tab" data-panel="cards">卡密管理</button>
            </div>

            <div class="tab-panels">
                <!-- 总览 -->
                <div class="panel active" id="panelDashboard">
                    <div class="stats-grid">
                        <div class="stat-card"><div class="label">总用户</div><div class="value primary" id="statUsers">-</div></div>
                        <div class="stat-card"><div class="label">聊天消息</div><div class="value" id="statChats">-</div></div>
                        <div class="stat-card"><div class="label">卡密总数</div><div class="value green" id="statCards">-</div></div>
                        <div class="stat-card"><div class="label">可用模型</div><div class="value orange" id="statModels">-</div></div>
                    </div>
                    <div style="background:white;border:1px solid #e5e6eb;border-radius:14px;padding:20px;">
                        <div style="font-weight:500;margin-bottom:12px;">系统信息</div>
                        <div style="color:#7e8493;font-size:14px;line-height:2;">
                            · 后端地址：<code>https://yisui-ai-production.up.railway.app</code><br>
                            · 数据存储：JSON 文件（用户、聊天记录、卡密）<br>
                            · 聊天记录自动保存：已开启<br>
                            · 管理员密码：可在 Railway 环境变量 ADMIN_PASSWORD 中修改
                        </div>
                    </div>
                </div>

                <!-- 用户管理 -->
                <div class="panel" id="panelUsers">
                    <div class="toolbar">
                        <input type="text" id="userSearch" placeholder="搜索用户ID / 昵称 / 邮箱..." />
                        <button class="btn btn-primary" onclick="loadUsers(1)">查询</button>
                        <button class="btn btn-secondary" onclick="resetUsers()">重置</button>
                    </div>
                    <div class="list-container">
                        <div id="userList"></div>
                        <div class="pagination" id="userPagination"></div>
                    </div>
                </div>

                <!-- 聊天记录 -->
                <div class="panel" id="panelChats">
                    <div class="toolbar">
                        <input type="text" id="chatUserId" placeholder="用户ID（可选）" />
                        <input type="text" id="chatSearch" placeholder="搜索消息内容..." />
                        <button class="btn btn-primary" onclick="loadChats(1)">查询</button>
                        <button class="btn btn-secondary" onclick="resetChats()">重置</button>
                    </div>
                    <div class="list-container">
                        <div id="chatList"></div>
                        <div class="pagination" id="chatPagination"></div>
                    </div>
                </div>

                <!-- 卡密管理 -->
                <div class="panel" id="panelCards">
                    <div class="toolbar">
                        <input type="number" id="genCount" value="1" min="1" max="100" style="min-width:80px;" placeholder="数量" />
                        <input type="text" id="genPrefix" value="YS" style="min-width:80px;" placeholder="前缀" />
                        <button class="btn btn-primary" onclick="generateCards()">生成卡密</button>
                        <button class="btn btn-danger" onclick="cleanUsedCards()">清理已使用</button>
                        <button class="btn btn-secondary" onclick="loadCards()">刷新</button>
                    </div>
                    <div class="list-container">
                        <div id="cardList"></div>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <div class="toast" id="toast"></div>

    <script>
        const API_BASE = 'https://yisui-ai-production.up.railway.app';
        let token = localStorage.getItem('admin_token') || '';
        let userCurrentPage = 1;
        let chatCurrentPage = 1;
        const PAGE_SIZE = 20;

        // 初始化
        if (token) {
            document.getElementById('loginPage').style.display = 'none';
            document.getElementById('adminPage').style.display = 'flex';
            loadStats();
        }

        // 导航切换
        document.querySelectorAll('.nav-tab').forEach(tab => {
            tab.addEventListener('click', function() {
                document.querySelectorAll('.nav-tab').forEach(t => t.classList.remove('active'));
                this.classList.add('active');
                const panelId = this.dataset.panel;
                document.querySelectorAll('.panel').forEach(p => p.classList.remove('active'));
                document.getElementById('panel' + panelId.charAt(0).toUpperCase() + panelId.slice(1)).classList.add('active');
                if (panelId === 'users') loadUsers(1);
                if (panelId === 'chats') loadChats(1);
                if (panelId === 'cards') loadCards();
                if (panelId === 'dashboard') loadStats();
            });
        });

        // Toast
        function showToast(msg, type = 'success') {
            const toast = document.getElementById('toast');
            toast.textContent = msg;
            toast.className = 'toast ' + type;
            toast.style.display = 'block';
            clearTimeout(toast._timer);
            toast._timer = setTimeout(() => { toast.style.display = 'none'; }, 3000);
        }

        // 登录
        async function login() {
            const password = document.getElementById('passwordInput').value;
            const errorEl = document.getElementById('loginError');
            errorEl.style.display = 'none';
            if (!password) { errorEl.textContent = '请输入密码'; errorEl.style.display = 'block'; return; }
            try {
                const res = await fetch(API_BASE + '/api/admin/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ password })
                });
                const data = await res.json();
                if (data.success) {
                    token = data.token;
                    localStorage.setItem('admin_token', token);
                    document.getElementById('loginPage').style.display = 'none';
                    document.getElementById('adminPage').style.display = 'flex';
                    loadStats();
                    showToast('登录成功', 'success');
                } else {
                    errorEl.textContent = data.message || '登录失败';
                    errorEl.style.display = 'block';
                }
            } catch (e) {
                errorEl.textContent = '网络错误：' + e.message;
                errorEl.style.display = 'block';
            }
        }

        // 退出登录
        function handleLogout() {
            if (confirm('确定要退出登录吗？')) {
                localStorage.removeItem('admin_token');
                token = '';
                document.getElementById('adminPage').style.display = 'none';
                document.getElementById('loginPage').style.display = 'flex';
                document.getElementById('passwordInput').value = '';
                showToast('已安全退出', 'success');
            }
        }

        // 加载统计
        async function loadStats() {
            try {
                const res = await fetch(API_BASE + '/api/admin/stats', {
                    headers: { 'Authorization': 'Bearer ' + token }
                });
                const data = await res.json();
                if (data.success) {
                    document.getElementById('statCards').textContent = data.data.totalCards;
                    document.getElementById('statModels').textContent = data.data.availableModels;
                }
            } catch (e) { console.error(e); }
            // 加载用户数和聊天数
            try {
                const res = await fetch(API_BASE + '/api/admin/users?limit=1', {
                    headers: { 'Authorization': 'Bearer ' + token }
                });
                const data = await res.json();
                if (data.success) document.getElementById('statUsers').textContent = data.data.total;
            } catch (e) {}
            try {
                const res = await fetch(API_BASE + '/api/admin/chats?limit=1', {
                    headers: { 'Authorization': 'Bearer ' + token }
                });
                const data = await res.json();
                if (data.success) document.getElementById('statChats').textContent = data.data.total;
            } catch (e) {}
        }

        // 加载用户列表
        async function loadUsers(page = 1) {
            userCurrentPage = page;
            const search = document.getElementById('userSearch').value.trim();
            const listEl = document.getElementById('userList');
            listEl.innerHTML = '<div class="empty-state">加载中...</div>';
            try {
                let url = API_BASE + '/api/admin/users?page=' + page + '&limit=' + PAGE_SIZE;
                if (search) url += '&search=' + encodeURIComponent(search);
                const res = await fetch(url, { headers: { 'Authorization': 'Bearer ' + token } });
                const data = await res.json();
                if (data.success) {
                    const users = data.data.users;
                    if (users.length === 0) {
                        listEl.innerHTML = '<div class="empty-state">暂无用户</div>';
                    } else {
                        listEl.innerHTML = users.map(u => `
                            <div class="list-item">
                                <div class="main-info">
                                    <span class="title">${u.username} (${u.id})</span>
                                    <span class="sub">注册：${u.createdAt ? new Date(u.createdAt).toLocaleString('zh-CN') : '-'} | 上次登录：${u.lastLoginAt ? new Date(u.lastLoginAt).toLocaleString('zh-CN') : '-'}</span>
                                </div>
                                <div class="actions">
                                    <span class="status-tag ${u.status === 'banned' ? 'used' : 'unused'}">${u.status === 'banned' ? '已封禁' : '正常'}</span>
                                    <button class="btn ${u.status === 'banned' ? 'btn-secondary' : 'btn-danger'} btn-sm" onclick="toggleBanUser('${u.id}', ${u.status === 'banned' ? 'false' : 'true'})">${u.status === 'banned' ? '解封' : '封禁'}</button>
                                </div>
                            </div>
                        `).join('');
                    }
                    renderPagination('userPagination', data.data.total, page, loadUsers);
                } else {
                    listEl.innerHTML = '<div class="empty-state">加载失败：' + data.message + '</div>';
                }
            } catch (e) {
                listEl.innerHTML = '<div class="empty-state">网络错误：' + e.message + '</div>';
            }
        }

        // 封禁/解封用户
        async function toggleBanUser(userId, banned) {
            const action = banned ? '封禁' : '解封';
            if (!confirm(`确定要${action}该用户吗？`)) return;
            try {
                const res = await fetch(API_BASE + '/api/admin/users/' + userId + '/ban', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + token },
                    body: JSON.stringify({ banned })
                });
                const data = await res.json();
                if (data.success) {
                    showToast(data.message, 'success');
                    loadUsers(userCurrentPage);
                } else {
                    showToast(data.message || '操作失败', 'error');
                }
            } catch (e) {
                showToast('网络错误：' + e.message, 'error');
            }
        }

        function resetUsers() {
            document.getElementById('userSearch').value = '';
            loadUsers(1);
        }

        // 加载聊天记录
        async function loadChats(page = 1) {
            chatCurrentPage = page;
            const userId = document.getElementById('chatUserId').value.trim();
            const search = document.getElementById('chatSearch').value.trim();
            const listEl = document.getElementById('chatList');
            listEl.innerHTML = '<div class="empty-state">加载中...</div>';
            try {
                let url = API_BASE + '/api/admin/chats?page=' + page + '&limit=' + PAGE_SIZE;
                if (userId) url += '&userId=' + encodeURIComponent(userId);
                if (search) url += '&search=' + encodeURIComponent(search);
                const res = await fetch(url, { headers: { 'Authorization': 'Bearer ' + token } });
                const data = await res.json();
                if (data.success) {
                    const chats = data.data.chats;
                    if (chats.length === 0) {
                        listEl.innerHTML = '<div class="empty-state">暂无聊天记录</div>';
                    } else {
                        listEl.innerHTML = chats.map(c => `
                            <div class="list-item">
                                <div class="main-info">
                                    <span class="title">${c.username} (${c.role === 'user' ? '用户' : 'AI'})</span>
                                    <span class="sub">${new Date(c.timestamp).toLocaleString('zh-CN')}${c.model ? ' | 模型：' + c.model : ''}</span>
                                    <div class="content-preview">${escapeHtml(c.content)}</div>
                                </div>
                                <div class="actions">
                                    <span class="status-tag ${c.role === 'user' ? 'pending' : 'unused'}">${c.role === 'user' ? '用户' : 'AI'}</span>
                                    <button class="btn btn-danger btn-sm" onclick="deleteChat('${c.id}')">删除</button>
                                </div>
                            </div>
                        `).join('');
                    }
                    renderPagination('chatPagination', data.data.total, page, loadChats);
                } else {
                    listEl.innerHTML = '<div class="empty-state">加载失败：' + data.message + '</div>';
                }
            } catch (e) {
                listEl.innerHTML = '<div class="empty-state">网络错误：' + e.message + '</div>';
            }
        }

        // 删除聊天记录
        async function deleteChat(chatId) {
            if (!confirm('确定删除该聊天记录吗？')) return;
            try {
                const res = await fetch(API_BASE + '/api/admin/chats/' + chatId, {
                    method: 'DELETE',
                    headers: { 'Authorization': 'Bearer ' + token }
                });
                const data = await res.json();
                if (data.success) {
                    showToast('删除成功', 'success');
                    loadChats(chatCurrentPage);
                } else {
                    showToast(data.message || '删除失败', 'error');
                }
            } catch (e) {
                showToast('网络错误：' + e.message, 'error');
            }
        }

        function resetChats() {
            document.getElementById('chatUserId').value = '';
            document.getElementById('chatSearch').value = '';
            loadChats(1);
        }

        // 加载卡密
        async function loadCards() {
            const listEl = document.getElementById('cardList');
            listEl.innerHTML = '<div class="empty-state">加载中...</div>';
            try {
                const res = await fetch(API_BASE + '/api/admin/cards', {
                    headers: { 'Authorization': 'Bearer ' + token }
                });
                const data = await res.json();
                if (data.success) {
                    const cards = data.data;
                    if (cards.length === 0) {
                        listEl.innerHTML = '<div class="empty-state">暂无卡密，点击上方"生成卡密"创建</div>';
                    } else {
                        listEl.innerHTML = cards.map(c => `
                            <div class="list-item">
                                <div class="main-info">
                                    <span class="title" style="font-family:monospace;">${c.key}</span>
                                    <span class="sub">创建：${c.createdAt ? new Date(c.createdAt).toLocaleString('zh-CN') : '-'}${c.usedAt ? ' | 使用：' + new Date(c.usedAt).toLocaleString('zh-CN') : ''}</span>
                                </div>
                                <div class="actions">
                                    <span class="status-tag ${c.used ? 'used' : 'unused'}">${c.used ? '已使用' : '未使用'}</span>
                                    <button class="btn btn-danger btn-sm" onclick="deleteCard('${c.key}')">删除</button>
                                </div>
                            </div>
                        `).join('');
                    }
                } else {
                    listEl.innerHTML = '<div class="empty-state">加载失败：' + data.message + '</div>';
                }
            } catch (e) {
                listEl.innerHTML = '<div class="empty-state">网络错误：' + e.message + '</div>';
            }
        }

        // 生成卡密
        async function generateCards() {
            const count = parseInt(document.getElementById('genCount').value) || 1;
            const prefix = document.getElementById('genPrefix').value || 'YS';
            try {
                const res = await fetch(API_BASE + '/api/admin/cards', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + token },
                    body: JSON.stringify({ count, prefix })
                });
                const data = await res.json();
                if (data.success) {
                    showToast(data.message, 'success');
                    loadCards();
                    loadStats();
                } else {
                    showToast(data.message || '生成失败', 'error');
                }
            } catch (e) {
                showToast('网络错误：' + e.message, 'error');
            }
        }

        // 删除卡密
        async function deleteCard(key) {
            if (!confirm('确定删除该卡密吗？')) return;
            try {
                const res = await fetch(API_BASE + '/api/admin/cards/' + encodeURIComponent(key), {
                    method: 'DELETE',
                    headers: { 'Authorization': 'Bearer ' + token }
                });
                const data = await res.json();
                if (data.success) {
                    showToast('删除成功', 'success');
                    loadCards();
                    loadStats();
                } else {
                    showToast(data.message || '删除失败', 'error');
                }
            } catch (e) {
                showToast('网络错误：' + e.message, 'error');
            }
        }

        // 清理已使用卡密
        async function cleanUsedCards() {
            if (!confirm('确定清理所有已使用的卡密吗？不可恢复！')) return;
            try {
                const res = await fetch(API_BASE + '/api/admin/cards/clean', {
                    method: 'POST',
                    headers: { 'Authorization': 'Bearer ' + token }
                });
                const data = await res.json();
                if (data.success) {
                    showToast(data.message, 'success');
                    loadCards();
                    loadStats();
                } else {
                    showToast(data.message || '清理失败', 'error');
                }
            } catch (e) {
                showToast('网络错误：' + e.message, 'error');
            }
        }

        // 分页
        function renderPagination(containerId, total, currentPage, loadFunc) {
            const container = document.getElementById(containerId);
            const totalPages = Math.ceil(total / PAGE_SIZE);
            if (totalPages <= 1) { container.innerHTML = ''; return; }
            let html = `<button ${currentPage === 1 ? 'disabled' : ''} onclick="${loadFunc.name}(${currentPage - 1})">上一页</button>`;
            for (let i = 1; i <= totalPages; i++) {
                if (i === 1 || i === totalPages || (i >= currentPage - 2 && i <= currentPage + 2)) {
                    html += `<button class="${i === currentPage ? 'active' : ''}" onclick="${loadFunc.name}(${i})">${i}</button>`;
                } else if (i === currentPage - 3 || i === currentPage + 3) {
                    html += '<span style="padding:0 4px;">...</span>';
                }
            }
            html += `<button ${currentPage === totalPages ? 'disabled' : ''} onclick="${loadFunc.name}(${currentPage + 1})">下一页</button>`;
            container.innerHTML = html;
        }

        // HTML 转义
        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }
    </script>
</body>
</html>
