            height: 6px;
            background: #e5e6eb;
            border-radius: 3px;
            overflow: hidden;
        }

        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, #3370ff, #5b8def);
            border-radius: 3px;
            width: 0%;
            transition: width 0.3s ease;
            animation: loading 1.5s ease-in-out infinite;
        }

        @keyframes loading {

            border: none;
