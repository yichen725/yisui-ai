<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>逸碎AI - 管理后台</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "PingFang SC", "Microsoft YaHei", sans-serif;
            background: #f7f8fa;
            color: #1f2329;
            min-height: 100vh;
        }
        /* 登录页 */
        .login-container {
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 20px;
        }
        .login-card {
            background: white;
            border: 1px solid #e5e6eb;
            border-radius: 12px;
            padding: 40px 32px;
            width: 100%;
            max-width: 380px;
        }
        .login-card h1 {
            font-size: 22px;
            font-weight: 600;
            text-align: center;
            margin-bottom: 8px;
        }
        .login-card .subtitle {
            font-size: 14px;
            color: #646a73;
            text-align: center;
            margin-bottom: 28px;
        }
        .form-group { margin-bottom: 16px; }
        .form-group label {
            display: block;
            font-size: 13px;
            color: #646a73;
            margin-bottom: 6px;
        }
        .form-group input {
            width: 100%;
            padding: 12px 14px;
            border: 1px solid #e5e6eb;
            border-radius: 8px;
            font-size: 15px;
            font-family: inherit;
            outline: none;
            transition: border-color 0.2s;
        }
        .form-group input:focus { border-color: #3370ff; }
        .btn {
            display: block;
            width: 100%;
            padding: 12px;
            border: none;
            border-radius: 8px;
            font-size: 15px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s;
            font-family: inherit;
        }
        .btn-primary {
            background: #3370ff;
            color: white;
        }
        .btn-primary:hover { background: #2860e1; }
        .btn-secondary {
            background: #f5f6f7;
            color: #1f2329;
        }
        .btn-secondary:hover { background: #e8eaed; }
        .btn-danger {
            background: #ff4d4f;
            color: white;
        }
        .btn-danger:hover { background: #d9363e; }
        .btn-sm {
            padding: 6px 12px;
            font-size: 13px;
            width: auto;
            display: inline-block;
        }
        .error-msg {
            color: #ff4d4f;
            font-size: 13px;
            text-align: center;
            margin-top: 12px;
            display: none;
        }
        /* 管理后台 */
        .admin-container { display: none; }
        .admin-header {
            background: white;
            border-bottom: 1px solid #e5e6eb;
            padding: 12px 24px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            position: sticky;
            top: 0;
            z-index: 100;
        }
        .admin-header .logo {
            font-size: 18px;
            font-weight: 600;
        }
        .admin-header .logo span { color: #3370ff; }
        .admin-header .actions { display: flex; gap: 8px; align-items: center; }
        .admin-header .user-info {
            font-size: 13px;
            color: #646a73;
        }
        .admin-body {
            max-width: 1200px;
            margin: 0 auto;
            padding: 24px;
        }
        /* 统计卡片 */
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 16px;
            margin-bottom: 24px;
        }
        .stat-card {
            background: white;
            border: 1px solid #e5e6eb;
            border-radius: 12px;
            padding: 20px;
        }
        .stat-card .label {
            font-size: 13px;
            color: #646a73;
            margin-bottom: 8px;
        }
        .stat-card .value {
            font-size: 28px;
            font-weight: 700;
            color: #1f2329;
        }
        .stat-card .value.primary { color: #3370ff; }
        .stat-card .value.success { color: #52c41a; }
        .stat-card .value.warning { color: #faad14; }
        /* 选项卡 */
        .tabs {
            display: flex;
            gap: 4px;
            margin-bottom: 20px;
            background: white;
            border: 1px solid #e5e6eb;
            border-radius: 10px;
            padding: 4px;
            width: fit-content;
        }
        .tab {
            padding: 8px 20px;
            border: none;
            background: transparent;
            border-radius: 7px;
            font-size: 14px;
            cursor: pointer;
            color: #646a73;
            transition: all 0.2s;
            font-family: inherit;
        }
        .tab.active {
            background: #3370ff;
            color: white;
        }
        .tab-content { display: none; }
        .tab-content.active { display: block; }
        /* 卡密管理 */
        .toolbar {
            display: flex;
            gap: 12px;
            margin-bottom: 16px;
            flex-wrap: wrap;
            align-items: center;
        }
        .toolbar input, .toolbar select {
            padding: 8px 12px;
            border: 1px solid #e5e6eb;
            border-radius: 8px;
            font-size: 14px;
            font-family: inherit;
            outline: none;
        }
        .toolbar input:focus { border-color: #3370ff; }
        .card-list {
            background: white;
            border: 1px solid #e5e6eb;
            border-radius: 12px;
            overflow: hidden;
        }
        .card-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 14px 20px;
            border-bottom: 1px solid #f0f1f2;
        }
        .card-item:last-child { border-bottom: none; }
        .card-item .card-key {
            font-family: 'SF Mono', Monaco, Consolas, monospace;
            font-size: 14px;
            color: #1f2329;
        }
        .card-item .card-info {
            display: flex;
            align-items: center;
            gap: 12px;
        }
        .status-tag {
            padding: 3px 10px;
            border-radius: 10px;
            font-size: 12px;
            font-weight: 500;
        }
        .status-tag.used {
            background: #fff1f0;
            color: #ff4d4f;
        }
        .status-tag.unused {
            background: #f6ffed;
            color: #52c41a;
        }
        .card-item .card-time {
            font-size: 12px;
            color: #999;
        }
        .empty-state {
            text-align: center;
            padding: 40px;
            color: #999;
            font-size: 14px;
        }
        .toast {
            position: fixed;
            top: 20px;
            right: 20px;
            padding: 12px 20px;
            border-radius: 8px;
            font-size: 14px;
            z-index: 1000;
            display: none;
        }
        .toast.success {
            background: #f6ffed;
            border: 1px solid #b7eb8f;
            color: #52c41a;
        }
        .toast.error {
            background: #fff1f0;
            border: 1px solid #ffa39e;
            color: #ff4d4f;
        }
        @media (max-width: 640px) {
            .admin-body { padding: 16px; }
            .stats-grid { grid-template-columns: 1fr 1fr; }
            .card-item { flex-direction: column; align-items: flex-start; gap: 8px; }
        }
    </style>
</head>
<body>
    <!-- 登录页 -->
    <div class="login-container" id="loginPage">
        <div class="login-card">
            <h1>逸碎AI 管理后台</h1>
            <p class="subtitle">请输入管理员密码登录</p>
            <div class="form-group">
                <label>管理员密码</label>
                <input type="password" id="passwordInput" placeholder="请输入密码" onkeydown="if(event.key==='Enter')login()">
            </div>
            <button class="btn btn-primary" onclick="login()">登录</button>
            <div class="error-msg" id="loginError"></div>
        </div>
    </div>

    <!-- 管理后台 -->
    <div class="admin-container" id="adminPage">
        <div class="admin-header">
            <div class="logo">逸碎<span>AI</span> 管理后台</div>
            <div class="actions">
                <span class="user-info">管理员</span>
                <button class="btn btn-secondary btn-sm" onclick="logout()">退出登录</button>
            </div>
        </div>

        <div class="admin-body">
            <!-- 统计卡片 -->
            <div class="stats-grid" id="statsGrid">
                <div class="stat-card">
                    <div class="label">卡密总数</div>
                    <div class="value primary" id="statTotal">-</div>
                </div>
                <div class="stat-card">
                    <div class="label">已使用</div>
                    <div class="value warning" id="statUsed">-</div>
                </div>
                <div class="stat-card">
                    <div class="label">未使用</div>
                    <div class="value success" id="statAvailable">-</div>
                </div>
                <div class="stat-card">
                    <div class="label">可用模型</div>
                    <div class="value" id="statModels">-</div>
                </div>
            </div>

            <!-- 选项卡 -->
            <div class="tabs">
                <button class="tab active" onclick="switchTab('cards')">卡密管理</button>
                <button class="tab" onclick="switchTab('models')">模型状态</button>
            </div>

            <!-- 卡密管理 -->
            <div class="tab-content active" id="tabCards">
                <div class="toolbar">
                    <input type="number" id="genCount" value="1" min="1" max="100" style="width:80px;" placeholder="数量">
                    <input type="text" id="genPrefix" value="YS" style="width:80px;" placeholder="前缀">
                    <button class="btn btn-primary btn-sm" onclick="generateCards()">生成卡密</button>
                    <button class="btn btn-secondary btn-sm" onclick="loadCards()">刷新</button>
                    <button class="btn btn-danger btn-sm" onclick="cleanUsedCards()">清理已使用</button>
                </div>
                <div class="card-list" id="cardList">
                    <div class="empty-state">加载中...</div>
                </div>
            </div>

            <!-- 模型状态 -->
            <div class="tab-content" id="tabModels">
                <div class="card-list" id="modelList">
                    <div class="empty-state">加载中...</div>
                </div>
            </div>
        </div>
    </div>

    <div class="toast" id="toast"></div>

    <script>
        const API_BASE = 'https://yisui-ai-production.up.railway.app';
        let token = localStorage.getItem('admin_token') || '';

        // 初始化
        if (token) {
            document.getElementById('loginPage').style.display = 'none';
            document.getElementById('adminPage').style.display = 'block';
            loadStats();
            loadCards();
            loadModels();
        }

        // 登录
        async function login() {
            const password = document.getElementById('passwordInput').value;
            const errorEl = document.getElementById('loginError');
            errorEl.style.display = 'none';

            if (!password) {
                errorEl.textContent = '请输入密码';
                errorEl.style.display = 'block';
                return;
            }

            try {
                const res = await fetch(API_BASE + '/api/admin/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ password })
                });
                const data = await res.json();
                if (data.success) {
                    token = data.token;
                    localStorage.setItem('admin_token', token);
                    document.getElementById('loginPage').style.display = 'none';
                    document.getElementById('adminPage').style.display = 'block';
                    loadStats();
                    loadCards();
                    loadModels();
                    showToast('登录成功', 'success');
                } else {
                    errorEl.textContent = data.message || '登录失败';
                    errorEl.style.display = 'block';
                }
            } catch (e) {
                errorEl.textContent = '网络错误：' + e.message;
                errorEl.style.display = 'block';
            }
        }

        // 退出登录
        function logout() {
            localStorage.removeItem('admin_token');
            token = '';
            document.getElementById('adminPage').style.display = 'none';
            document.getElementById('loginPage').style.display = 'flex';
            document.getElementById('passwordInput').value = '';
        }

        // 加载统计
        async function loadStats() {
            try {
                const res = await fetch(API_BASE + '/api/admin/stats', {
                    headers: { 'Authorization': 'Bearer ' + token }
                });
                const data = await res.json();
                if (data.success) {
                    document.getElementById('statTotal').textContent = data.data.totalCards;
                    document.getElementById('statUsed').textContent = data.data.usedCards;
                    document.getElementById('statAvailable').textContent = data.data.availableCards;
                    document.getElementById('statModels').textContent = data.data.availableModels;
                }
            } catch (e) {
                console.error('加载统计失败:', e);
            }
        }

        // 加载卡密列表
        async function loadCards() {
            const listEl = document.getElementById('cardList');
            listEl.innerHTML = '<div class="empty-state">加载中...</div>';
            try {
                const res = await fetch(API_BASE + '/api/admin/cards', {
                    headers: { 'Authorization': 'Bearer ' + token }
                });
                const data = await res.json();
                if (data.success) {
                    if (data.data.length === 0) {
                        listEl.innerHTML = '<div class="empty-state">暂无卡密，点击上方"生成卡密"创建</div>';
                        return;
                    }
                    listEl.innerHTML = data.data.map(card => `
                        <div class="card-item">
                            <div>
                                <div class="card-key">${card.key}</div>
                                <div class="card-time">${card.createdAt ? new Date(card.createdAt).toLocaleString('zh-CN') : ''}${card.usedAt ? ' | 使用于 ' + new Date(card.usedAt).toLocaleString('zh-CN') : ''}</div>
                            </div>
                            <div class="card-info">
                                <span class="status-tag ${card.used ? 'used' : 'unused'}">${card.used ? '已使用' : '未使用'}</span>
                                <button class="btn btn-danger btn-sm" onclick="deleteCard('${card.key}')">删除</button>
                            </div>
                        </div>
                    `).join('');
                } else {
                    listEl.innerHTML = '<div class="empty-state">加载失败：' + data.message + '</div>';
                }
            } catch (e) {
                listEl.innerHTML = '<div class="empty-state">网络错误：' + e.message + '</div>';
            }
        }

        // 生成卡密
        async function generateCards() {
            const count = parseInt(document.getElementById('genCount').value) || 1;
            const prefix = document.getElementById('genPrefix').value || 'YS';
            try {
                const res = await fetch(API_BASE + '/api/admin/cards', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': 'Bearer ' + token
                    },
                    body: JSON.stringify({ count, prefix })
                });
                const data = await res.json();
                if (data.success) {
                    showToast(data.message, 'success');
                    loadStats();
                    loadCards();
                } else {
                    showToast(data.message || '生成失败', 'error');
                }
            } catch (e) {
                showToast('网络错误：' + e.message, 'error');
            }
        }

        // 删除卡密
        async function deleteCard(key) {
            if (!confirm('确定删除该卡密吗？')) return;
            try {
                const res = await fetch(API_BASE + '/api/admin/cards/' + encodeURIComponent(key), {
                    method: 'DELETE',
                    headers: { 'Authorization': 'Bearer ' + token }
                });
                const data = await res.json();
                if (data.success) {
                    showToast('删除成功', 'success');
                    loadStats();
                    loadCards();
                } else {
                    showToast(data.message || '删除失败', 'error');
                }
            } catch (e) {
                showToast('网络错误：' + e.message, 'error');
            }
        }

        // 清理已使用卡密
        async function cleanUsedCards() {
            if (!confirm('确定清理所有已使用的卡密吗？此操作不可恢复！')) return;
            try {
                const res = await fetch(API_BASE + '/api/admin/cards/clean', {
                    method: 'POST',
                    headers: { 'Authorization': 'Bearer ' + token }
                });
                const data = await res.json();
                if (data.success) {
                    showToast(data.message, 'success');
                    loadStats();
                    loadCards();
                } else {
                    showToast(data.message || '清理失败', 'error');
                }
            } catch (e) {
                showToast('网络错误：' + e.message, 'error');
            }
        }

        // 加载模型状态
        async function loadModels() {
            const listEl = document.getElementById('modelList');
            listEl.innerHTML = '<div class="empty-state">加载中...</div>';
            try {
                const res = await fetch(API_BASE + '/api/admin/stats', {
                    headers: { 'Authorization': 'Bearer ' + token }
                });
                const data = await res.json();
                if (data.success) {
                    const models = data.data.models;
                    const providers = data.data.providers;
                    let html = '';
                    // 服务商状态
                    html += '<div class="card-item"><div><div class="card-key">服务商配置状态</div></div></div>';
                    for (const [provider, info] of Object.entries(providers)) {
                        html += `<div class="card-item">
                            <div><div class="card-key">${provider}</div><div class="card-time">环境变量：${info.envVar}</div></div>
                            <span class="status-tag ${info.configured ? 'unused' : 'used'}">${info.configured ? '已配置' : '未配置'}</span>
                        </div>`;
                    }
                    html += '<div class="card-item"><div><div class="card-key">可用模型列表</div></div></div>';
                    if (models.length === 0) {
                        html += '<div class="empty-state">暂无可用模型，请配置 API Key</div>';
                    } else {
                        models.forEach(m => {
                            html += `<div class="card-item">
                                <div><div class="card-key">${m.id}</div><div class="card-time">${m.name}</div></div>
                                <span class="status-tag unused">${m.provider}</span>
                            </div>`;
                        });
                    }
                    listEl.innerHTML = html;
                }
            } catch (e) {
                listEl.innerHTML = '<div class="empty-state">网络错误：' + e.message + '</div>';
            }
        }

        // 切换选项卡
        function switchTab(tab) {
            document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
            document.querySelectorAll('.tab-content').forEach(t => t.classList.remove('active'));
            event.target.classList.add('active');
            document.getElementById('tab' + tab.charAt(0).toUpperCase() + tab.slice(1)).classList.add('active');
        }

        // 提示
        function showToast(msg, type) {
            const toast = document.getElementById('toast');
            toast.textContent = msg;
            toast.className = 'toast ' + type;
            toast.style.display = 'block';
            setTimeout(() => { toast.style.display = 'none'; }, 3000);
        }
    </script>
</body>
</html>
